name: Publish

on:
  push:
    tags: ["logic-atlas-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lib
      - name: Tag matches package version
        run: test "logic-atlas-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The first release of a new package name is published by hand (trusted
      # publishing needs the package to exist); skip a version already on npm.
      - name: Publish unless this version is already on npm
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "logic-atlas@$v" version >/dev/null 2>&1; then
            echo "logic-atlas@$v is already on npm; nothing to publish"
          else
            npm publish --access public
          fi
